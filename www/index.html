<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Games</title>

<!-- Locked viewport: no pinch zoom, no double-tap zoom, draws under the notch. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12181e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Games">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2312181e'/%3E%3Crect x='8' y='26' width='30' height='18' fill='%23c99a2e'/%3E%3Crect x='38' y='20' width='18' height='24' fill='%23c8471f'/%3E%3Ccircle cx='18' cy='48' r='7' fill='%23262c30'/%3E%3Ccircle cx='46' cy='48' r='7' fill='%23262c30'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2312181e'/%3E%3Crect x='8' y='26' width='30' height='18' fill='%23c99a2e'/%3E%3Crect x='38' y='20' width='18' height='24' fill='%23c8471f'/%3E%3Ccircle cx='18' cy='48' r='7' fill='%23262c30'/%3E%3Ccircle cx='46' cy='48' r='7' fill='%23262c30'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="board" width="480" height="480" aria-label="Game board"></canvas>

<div class="readout" id="readout">
  <span id="score-label">Score</span> <b id="score">0</b>
  <span id="best-label">Best</span> <b id="best">0</b>
</div>

<div class="hint" id="hint">Loading…</div>
<button class="again" id="again" type="button" hidden>Play again</button>

<div class="pad" id="pad" aria-label="Direction controls" hidden>
  <button class="up"    type="button" data-dir="0" aria-label="Up">&uarr;</button>
  <button class="left"  type="button" data-dir="3" aria-label="Left">&larr;</button>
  <button class="down"  type="button" data-dir="2" aria-label="Down">&darr;</button>
  <button class="right" type="button" data-dir="1" aria-label="Right">&rarr;</button>
</div>

<button class="turn" id="turn" type="button" aria-label="Turn the truck around" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
    <polyline points="20 3 20 8 15 8"/>
  </svg>
</button>

<button class="menu-btn" id="menu" type="button" aria-label="Menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
</button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Choose a game">
  <div class="sheet-inner">
    <h2>Choose a game</h2>
    <div id="picks"></div>
    <p class="diag" id="diag"></p>
    <div class="minor">
      <button type="button" id="fresh">Start a fresh world</button>
      <button type="button" id="mute">Sound on</button>
      <button type="button" id="full" hidden>Full screen</button>
      <button type="button" id="close">Back to the game</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
