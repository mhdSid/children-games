<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Games</title>

<!-- Locked viewport: no pinch zoom, no double-tap zoom, draws under the notch. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12181e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Games">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2312181e'/%3E%3Crect x='8' y='26' width='30' height='18' fill='%23c99a2e'/%3E%3Crect x='38' y='20' width='18' height='24' fill='%23c8471f'/%3E%3Ccircle cx='18' cy='48' r='7' fill='%23262c30'/%3E%3Ccircle cx='46' cy='48' r='7' fill='%23262c30'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2312181e'/%3E%3Crect x='8' y='26' width='30' height='18' fill='%23c99a2e'/%3E%3Crect x='38' y='20' width='18' height='24' fill='%23c8471f'/%3E%3Ccircle cx='18' cy='48' r='7' fill='%23262c30'/%3E%3Ccircle cx='46' cy='48' r='7' fill='%23262c30'/%3E%3C/svg%3E">

<style>
/* ------------------------------------------------------------ viewport lock
   Everything here exists to stop the page itself from moving while a small
   finger drags across it: no scroll, no bounce, no pinch, no pull-to-refresh,
   no text selection, no long-press callout. */

:root {
  --bg:        #12181e;
  --line:      #202c35;
  --ink:       #e6ede9;
  --ink-soft:  #7d8f88;
  --brass:     #c99a2e;
  --brass-dim: rgba(201, 154, 46, .17);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
}

body {
  position: fixed;
  inset: 0;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  color: var(--ink);
  font: 500 16px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system,
        "Segoe UI", Roboto, sans-serif;
}

/* ------------------------------------------------------------- the board
   Edge to edge. The framebuffer is resized to the viewport's aspect, so
   filling the box never stretches a pixel. */

#board {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--bg);
  image-rendering: pixelated;
  touch-action: none;
}

/* --------------------------------------------------------------- overlays
   Nothing here is a permanent floating button. There is deliberately nothing
   on screen for him to press by accident. */

.readout {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 10px);
  right: calc(env(safe-area-inset-right) + 14px);
  display: flex;
  gap: 12px;
  padding: 6px 12px;
  border-radius: 9px;
  background: rgba(13, 19, 24, .55);
  backdrop-filter: blur(6px);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}
.readout.on { opacity: 1; }
.readout b { color: var(--brass); font-weight: 700; }
.readout span { color: var(--ink-soft); }

.hint {
  position: fixed;
  left: 50%;
  /* clears the rock row along the bottom of the dump truck scene */
  bottom: calc(env(safe-area-inset-bottom) + 112px);
  transform: translateX(-50%);
  max-width: 88%;
  padding: 8px 16px;
  border-radius: 9px;
  background: rgba(13, 19, 24, .62);
  backdrop-filter: blur(6px);
  font-size: 14px;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: bottom .15s;
}
.hint[hidden] { display: none; }
.hint.above-pad { bottom: calc(env(safe-area-inset-bottom) + 148px); }

.again {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  color: #12181e;
  background: var(--brass);
  border: 0;
  border-radius: 12px;
  padding: 16px 30px;
  cursor: pointer;
  touch-action: manipulation;
}
.again[hidden] { display: none; }

/* ----------------------------------------------------------------- gamepad */

.pad {
  display: none !important;
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 16px);
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(3, 62px);
  grid-template-areas: ".  up ." "lf dn rt";
  gap: 6px;
}
.pad[hidden] { display: none; }

.pad button {
  font: inherit;
  font-size: 21px;
  color: var(--ink);
  background: rgba(27, 36, 44, .5);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(120, 140, 150, .22);
  border-radius: 13px;
  height: 52px;
  cursor: pointer;
  touch-action: manipulation;
}
.pad button:active { background: var(--brass-dim); border-color: var(--brass); }
.pad .up { grid-area: up; }
.pad .left { grid-area: lf; }
.pad .down { grid-area: dn; }
.pad .right { grid-area: rt; }

@media (orientation: landscape) and (max-height: 520px) {
  .pad { grid-template-columns: repeat(3, 52px); bottom: 10px; }
  .pad button { height: 42px; }
  .hint.above-pad { bottom: 124px; }
}

/* --------------------------------------------------------- turn the truck
   A floating control, unlike the game switcher — pressing it by accident just
   turns the truck round, which is a thing he might want anyway. */

#turn {
  position: fixed;
  right: calc(env(safe-area-inset-right) + 18px);
  bottom: calc(env(safe-area-inset-bottom) + 18px);
  width: 74px;
  height: 74px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid rgba(201, 154, 46, .55);
  background: rgba(27, 36, 44, .58);
  backdrop-filter: blur(6px);
  color: var(--brass);
  cursor: pointer;
  touch-action: manipulation;
  z-index: 4;
}
#turn[hidden] { display: none; }
#turn svg { width: 40px; height: 40px; fill: none; stroke: currentColor;
            stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
            transition: transform .42s cubic-bezier(.34,1.3,.5,1); }
#turn.spun svg { transform: rotate(180deg); }
#turn:active { background: var(--brass-dim); }

@media (orientation: landscape) and (max-height: 520px) {
  #turn { width: 62px; height: 62px; bottom: 12px; right: 12px; }
  #turn svg { width: 34px; height: 34px; }
}

/* ------------------------------------------------------------- corner hold
   The only way to change games. Invisible until it is being used, sized for
   an adult thumb in the very corner, and it needs a steady hold — none of
   which a two-year-old does by accident. */

#hold {
  position: fixed;
  top: 0;
  left: 0;
  width: 84px;
  height: 84px;
  touch-action: none;
  z-index: 5;
}

#ring {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 12px);
  left: calc(env(safe-area-inset-left) + 12px);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .12s;
  background:
    conic-gradient(var(--brass) calc(var(--p, 0) * 1turn), rgba(255,255,255,.13) 0);
  -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%);
          mask: radial-gradient(circle, transparent 58%, #000 60%);
  pointer-events: none;
}
#ring.on { opacity: 1; }

/* -------------------------------------------------------------- the switcher */

.sheet {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(9, 13, 17, .82);
  backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s;
}
.sheet.open { opacity: 1; pointer-events: auto; }

.sheet-inner {
  width: min(420px, 100%);
  display: grid;
  gap: 10px;
}

.sheet h2 {
  margin: 0 0 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: center;
}

.sheet .pick {
  font: inherit;
  font-size: 19px;
  font-weight: 700;
  text-align: left;
  color: var(--ink);
  background: rgba(32, 44, 53, .55);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 20px 22px;
  cursor: pointer;
  touch-action: manipulation;
}
.sheet .pick[aria-pressed="true"] {
  color: var(--brass);
  background: var(--brass-dim);
  border-color: rgba(201, 154, 46, .55);
}

.sheet .diag {
  margin: 2px 0 0;
  font: 400 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  color: var(--ink-soft);
  text-align: center;
  white-space: pre-wrap;
}

.sheet .minor {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.sheet .minor button {
  flex: 1;
  font: inherit;
  font-size: 14px;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px;
  cursor: pointer;
  touch-action: manipulation;
}
.sheet .minor button[hidden] { display: none; }

:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<canvas id="board" width="480" height="480" aria-label="Game board"></canvas>

<div class="readout" id="readout">
  <span id="score-label">Score</span> <b id="score">0</b>
  <span id="best-label">Best</span> <b id="best">0</b>
</div>

<div class="hint" id="hint">Loading…</div>
<button class="again" id="again" type="button" hidden>Play again</button>

<div class="pad" id="pad" aria-label="Direction controls" hidden>
  <button class="up"    type="button" data-dir="0" aria-label="Up">&uarr;</button>
  <button class="left"  type="button" data-dir="3" aria-label="Left">&larr;</button>
  <button class="down"  type="button" data-dir="2" aria-label="Down">&darr;</button>
  <button class="right" type="button" data-dir="1" aria-label="Right">&rarr;</button>
</div>

<button class="turn" id="turn" type="button" aria-label="Turn the truck around" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
    <polyline points="20 3 20 8 15 8"/>
  </svg>
</button>

<div id="hold" aria-hidden="true"></div>
<div id="ring"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Choose a game">
  <div class="sheet-inner">
    <h2>Choose a game</h2>
    <div id="picks"></div>
    <p class="diag" id="diag"></p>
    <div class="minor">
      <button type="button" id="test">Test sound</button>
      <button type="button" id="fresh">Start a fresh world</button>
      <button type="button" id="mute">Sound on</button>
      <button type="button" id="full" hidden>Full screen</button>
      <button type="button" id="close">Back to the game</button>
    </div>
  </div>
</div>

<script type="module">
const el     = (id) => document.getElementById(id);
const canvas = el("board");
const ctx    = canvas.getContext("2d", { alpha: false });

const DIRS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
               w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };

// Pointer phases, matching engine::{DOWN, MOVE, UP}.
const DOWN = 0, MOVE = 1, UP = 2;

// Must match engine::frame::{MAX_W, MAX_H}.
const MAX_W = 1200, MAX_H = 1200;
// Short side of the framebuffer. The long side follows the viewport's aspect.
const BASE = 480;

// One entry per game in the module. `keys` decides whether the D-pad and the
// swipe reader are live. Pointer events are always forwarded — games that
// ignore them inherit an empty `pointer` from the Game trait.
const GAMES = [
  {
    title: "Snake",
    keys: true,
    readout: true,
    score: "Score", best: "Best",
    hint: (st, sc) =>
      st === 0 ? "" // Swipe or tap a direction to start
    : st === 1 ? ""
    :            "Game over — " + sc + (sc === 1 ? " apple" : " apples"),
  },
  {
    title: "Dump Truck",
    keys: false,
    readout: false,
    score: "Loaded", best: "Most",
    hint: (st, sc) =>
      sc === 0 ? "" // Drag the rocks into the truck
               : "" // Tap the truck to tip them out
  },
];

// ---------------------------------------------------------------------- sound
// The module's one import. For a child who cannot read, this is half the
// feedback channel — so it is synthesised here rather than shipped as files:
// no assets, no loading, no licences.

const Sound = (() => {
  const OFF_KEY = "games.muted";
  let ac = null, master = null, noiseBuf = null;
  let eng = null, engGain = null, engFilt = null;
  let hyd = null, hydGain = null;
  let silent = null;

  // iPhones and iPads mute Web Audio outright when the ringer switch is set to
  // silent. A looping (silent) media element moves the page onto the media
  // playback path, which that switch does not gag. It is a workaround, not a
  // guarantee — behaviour varies by iOS version.
  const SILENT_WAV = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
  function holdSession() {
    if (silent) { silent.play().catch(() => {}); return; }
    try {
      silent = document.createElement("audio");
      silent.setAttribute("playsinline", "");
      silent.loop = true;
      silent.preload = "auto";
      silent.volume = 0.02;
      silent.src = SILENT_WAV;
      silent.play().catch(() => {});
    } catch { silent = null; }
  }
  let revNext = 0, revOn = false;
  // watchdog bookkeeping
  let lastClock = -1, stalls = 0, rebuilds = 0, played = 0, dropped = 0;
  let muted = false;
  try { muted = localStorage.getItem(OFF_KEY) === "1"; } catch { muted = false; }

  function teardown() {
    try { if (eng) eng.stop(); } catch {}
    try { if (hyd) hyd.stop(); } catch {}
    try { if (ac) ac.close(); } catch {}
    ac = master = noiseBuf = null;
    eng = engGain = engFilt = hyd = hydGain = null;
    lastClock = -1; stalls = 0;
  }

  // iOS can hand back a context that says "running" while its graph is dead —
  // typically after an interruption (a call, another app's audio, the screen
  // locking). Resuming does not revive it; only a fresh graph does.
  function rebuild() {
    rebuilds++;
    teardown();
    const c = ensure();
    if (c && c.state !== "running") c.resume().catch(() => {});
    holdSession();
  }

  function ensure() {
    if (ac) return ac;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    ac = new C();
    ac.onstatechange = () => {
      if (ac && ac.state === "suspended") ac.resume().catch(() => {});
    };

    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.45;
    master.connect(ac.destination);

    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    // One oscillator held for the life of the page: the engine note. Its
    // pitch and volume follow the truck's speed, which arrives every frame.
    eng = ac.createOscillator();
    eng.type = "sawtooth";
    eng.frequency.value = 42;
    engFilt = ac.createBiquadFilter();
    engFilt.type = "lowpass";
    engFilt.frequency.value = 260;
    engFilt.Q.value = 6;
    engGain = ac.createGain();
    engGain.gain.value = 0;
    eng.connect(engFilt); engFilt.connect(engGain); engGain.connect(master);
    eng.start();

    // The hydraulics are held too, so the note lasts exactly as long as the
    // bed is moving instead of finishing early and leaving it rising silently.
    hyd = ac.createOscillator();
    hyd.type = "sawtooth";
    hyd.frequency.value = 120;
    hydGain = ac.createGain();
    hydGain.gain.value = 0;
    const hydFilt = ac.createBiquadFilter();
    hydFilt.type = "bandpass";
    hydFilt.frequency.value = 520;
    hydFilt.Q.value = 3;
    hyd.connect(hydFilt); hydFilt.connect(hydGain); hydGain.connect(master);
    hyd.start();
    return ac;
  }

  function tone(type, f0, f1, dur, gain, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, ac.currentTime);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), ac.currentTime + dur);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(gain, ac.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(dest || master);
    o.start(); o.stop(ac.currentTime + dur + 0.02);
  }

  function thud(dur, cut, gain) {
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut;
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(); src.stop(ac.currentTime + dur);
  }

  // Pentatonic, so the counting notes are always consonant however they land.
  const NOTES = [392, 440, 523, 587, 659, 784, 880];

  function play(id, p) {
    // Not resumed yet: the watchdog and the document-level unlock retry, so
    // there is no point hammering resume() sixty times a second from here.
    if (!ac || ac.state !== "running") { dropped++; return; }
    played++;
    switch (id) {
      case 0: tone("triangle", 300, 620, 0.10, 0.16); break;            // pickup
      case 1: thud(0.16, 700, 0.30); tone("sine", 180, 110, 0.12, 0.16); break; // seat
      case 2: {                                                          // hydraulics
        if (!hydGain) break;
        const t = ac.currentTime;
        hydGain.gain.setTargetAtTime(p > 0 ? 0.020 + p * 0.030 : 0, t, 0.06);
        hyd.frequency.setTargetAtTime(120 + p * 260, t, 0.07);
        break;
      }
      case 3: thud(0.20 + p * 0.16, 380 + p * 900, 0.20 + p * 0.45);    // rock lands
              tone("sine", 150 - p * 40, 70, 0.16, 0.10 + p * 0.12); break;
      case 4: tone("square", 392, 392, 0.26, 0.13);                     // horn
              tone("square", 294, 294, 0.26, 0.10); break;
      case 5: {                                                          // engine
        if (!engGain) break;
        const t = ac.currentTime;
        engGain.gain.setTargetAtTime(0.030 + p * 0.075, t, 0.08);
        eng.frequency.setTargetAtTime(40 + p * 74, t, 0.09);
        engFilt.frequency.setTargetAtTime(220 + p * 900, t, 0.09);
        break;
      }
      case 6: {                                                          // reversing
        revOn = p > 0.5;
        if (revOn && ac.currentTime > revNext) {
          revNext = ac.currentTime + 0.62;
          tone("square", 1050, 1050, 0.16, 0.07);
        }
        break;
      }
      case 10:                                                           // stone set into the wall
        thud(0.12, 1500, 0.28);
        tone("triangle", 300 + p * 55, 260 + p * 55, 0.16, 0.13);
        break;
      case 11: {                                                         // the wall is finished
        [0, 140, 280, 460].forEach((t, i) =>
          setTimeout(() => tone("triangle", [523, 659, 784, 1047][i], [523, 659, 784, 1047][i], 0.30, 0.16), t));
        break;
      }
      case 9:                                                            // turning round
        tone("square", 300, 470, 0.16, 0.10);
        setTimeout(() => tone("square", 470, 300, 0.16, 0.08), 150);
        break;
      case 8:                                                            // rock onto rock
        thud(0.13, 1900 + p * 2200, 0.16 + p * 0.30);
        tone("triangle", 520 - p * 90, 300, 0.09, 0.07 + p * 0.06);
        break;
      case 7: {                                                          // the count changed
        const n = Math.max(0, Math.min(NOTES.length - 1, Math.round(p)));
        tone("triangle", NOTES[n], NOTES[n], 0.20, 0.13);
        break;
      }
    }
  }

  return {
    // Browsers will not start audio until the user has touched the page, and
    // iOS in particular wants a source to have actually run inside the gesture
    // before it considers the graph live. Resuming alone is not enough there.
    unlock() {
      holdSession();
      const c = ensure();
      if (!c) return;
      if (c.state === "suspended") c.resume().catch(() => {});
      try {
        const b = c.createBuffer(1, 1, c.sampleRate);
        const src = c.createBufferSource();
        src.buffer = b;
        src.connect(c.destination);
        src.start(0);
      } catch {}
    },
    state: () => (ac ? ac.state : "none"),

    /// Called a few times a second from the frame loop. Everything about
    /// mobile audio that breaks after it has started working is caught here:
    /// a context that got suspended, and one that claims to be running while
    /// its clock stands still.
    watch() {
      if (!ac) return;
      if (ac.state !== "running") {
        ac.resume().catch(() => {});
        holdSession();
        return;
      }
      if (ac.currentTime === lastClock) {
        if (++stalls >= 3) { stalls = 0; rebuild(); }
      } else {
        stalls = 0;
        lastClock = ac.currentTime;
      }
      if (silent && silent.paused) silent.play().catch(() => {});
    },

    info: () => ({
      state: ac ? ac.state : "none",
      clock: ac ? ac.currentTime.toFixed(1) : "-",
      rebuilds,
      played,
      dropped,
      media: silent ? (silent.paused ? "paused" : "playing") : "none",
    }),
    /// An unmistakable noise, for working out whether the problem is the game
    /// or the device.
    test() {
      this.unlock();
      if (!ac || ac.state !== "running") return false;
      master.gain.value = 0.6;
      tone("square", 523, 523, 0.18, 0.20);
      setTimeout(() => tone("square", 784, 784, 0.22, 0.20), 190);
      // back to the canonical level, not to whatever it happened to be —
      // pressing test twice used to latch the loud setting permanently
      setTimeout(() => { if (master) master.gain.value = muted ? 0 : 0.45; }, 500);
      return true;
    },
    play,
    isMuted: () => muted,
    toggle() {
      muted = !muted;
      try { localStorage.setItem(OFF_KEY, muted ? "1" : "0"); } catch {}
      if (master) master.gain.value = muted ? 0 : 0.45;
      return muted;
    },
    suspend() { if (ac && ac.state === "running") ac.suspend().catch(() => {}); },
    resume()  {
      if (ac && ac.state !== "running") ac.resume().catch(() => {});
      holdSession();
    },
  };
})();

let wasm, frame, fw = 0, fh = 0;

// ------------------------------------------------------------------- gestures
// Belt and braces alongside the CSS: kill anything that could still scroll,
// zoom, or pop a magnifier while he plays.

const stop = (e) => e.preventDefault();
document.addEventListener("touchmove",     stop, { passive: false });
document.addEventListener("gesturestart",  stop, { passive: false });
document.addEventListener("gesturechange", stop, { passive: false });
document.addEventListener("contextmenu",   stop);
document.addEventListener("dblclick",      stop, { passive: false });

// Unlock from any first touch, wherever it lands — the canvas handler alone
// misses taps that start on the menu, and misses them entirely if the module
// has not finished loading yet.
for (const ev of ["pointerdown", "touchend", "click"]) {
  document.addEventListener(ev, () => Sound.unlock(), { capture: true });
}

// A page can come back from being hidden, from the bfcache, or from losing
// focus, and iOS suspends audio for all three. Try to revive on all of them.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) Sound.suspend();
  else { Sound.resume(); Sound.watch(); }
});
addEventListener("pageshow", () => { Sound.resume(); Sound.watch(); });
addEventListener("focus",    () => { Sound.resume(); Sound.watch(); });

const pin = () => window.scrollTo(0, 0);
addEventListener("orientationchange", () => setTimeout(pin, 120));

// ------------------------------------------------------------------ resizing

/// The framebuffer matches the viewport's aspect, so the canvas can fill the
/// screen without distortion. Short side is fixed; long side follows.
function renderSize() {
  const vw = Math.max(1, innerWidth);
  const vh = Math.max(1, innerHeight);
  const ar = vw / vh;

  let w, h;
  if (ar <= 1) { w = BASE; h = Math.round(BASE / ar); }
  else         { h = BASE; w = Math.round(BASE * ar); }

  // Clamp to the buffer the module owns, keeping the aspect honest.
  if (h > MAX_H) { h = MAX_H; w = Math.round(MAX_H * ar); }
  if (w > MAX_W) { w = MAX_W; h = Math.round(MAX_W / ar); }

  return [Math.max(16, Math.min(MAX_W, w)), Math.max(16, Math.min(MAX_H, h))];
}

function fit() {
  if (!wasm) return;
  const [w, h] = renderSize();
  if (w === fw && h === fh) return;

  fw = w; fh = h;
  wasm.resize(w, h);            // re-deals the game: the board shape changed
  canvas.width = w;
  canvas.height = h;

  // ImageData backed directly by wasm linear memory — no copy on our side.
  // The module has no allocator, so memory never grows and this never detaches.
  const view = new Uint8ClampedArray(wasm.memory.buffer, wasm.frame_ptr(), w * h * 4);
  frame = new ImageData(view, w, h);
}

addEventListener("resize", () => { pin(); fit(); });

// ----------------------------------------------------------------------- boot

async function boot() {
  let instance;
  const imports = { env: { host_sfx: (id, p) => Sound.play(id, p) } };
  try {
    ({ instance } = await WebAssembly.instantiateStreaming(fetch("games.wasm"), imports));
  } catch {
    // instantiateStreaming needs application/wasm; fall back if the server
    // sends something else.
    const bytes = await fetch("games.wasm").then((r) => r.arrayBuffer());
    ({ instance } = await WebAssembly.instantiate(bytes, imports));
  }

  wasm = instance.exports;
  wasm.init((Date.now() ^ (performance.now() * 1000)) >>> 0);

  buildPicks();
  fit();
  applyGame(wasm.current());
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------- games

function buildPicks() {
  const host = el("picks");
  host.replaceChildren();
  const wrap = document.createElement("div");
  wrap.style.display = "grid";
  wrap.style.gap = "10px";
  for (let i = 0; i < wasm.game_count(); i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pick";
    b.textContent = GAMES[i] ? GAMES[i].title : "Game " + i;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => { switchTo(i); closeSheet(); });
    wrap.append(b);
  }
  host.append(wrap);
}

function applyGame(id) {
  const g = GAMES[id] || GAMES[0];
  el("turn").hidden = !wasm.can_flip();
  el("score-label").textContent = g.score;
  el("best-label").textContent  = g.best;
  el("pad").hidden = !g.keys;
  el("hint").classList.toggle("above-pad", g.keys);
  el("readout").classList.toggle("on", g.readout);
  [...el("picks").querySelectorAll(".pick")].forEach((b, i) =>
    b.setAttribute("aria-pressed", String(i === id)));
}

function switchTo(id) {
  if (!wasm || id === wasm.current()) return;
  wasm.select(id);
  applyGame(id);
}

// ----------------------------------------------------------------------- loop

let prev = performance.now();
let frames = 0;

function loop(now) {
  const dt = now - prev;
  prev = now;

  // Four times a second is plenty to catch a context that has died, and cheap
  // enough not to matter.
  if ((frames++ & 15) === 0) Sound.watch();

  wasm.tick(dt);
  ctx.putImageData(frame, 0, 0);

  const g     = GAMES[wasm.current()] || GAMES[0];
  const state = wasm.status();
  const sc    = wasm.score();

  el("score").textContent = sc;
  el("best").textContent  = wasm.best();
  el("again").hidden      = state !== 2;

  const text = g.hint(state, sc);
  el("hint").textContent = text;
  el("hint").hidden = text === "";

  requestAnimationFrame(loop);
}

// ------------------------------------------------------------- corner hold
// Hold the top-left corner for 1.6 s to open the switcher. Nothing is drawn
// until the hold is underway, so there is no button inviting a small hand,
// and a stray palm or a quick tap never gets there.

const HOLD_MS = 1600;
let holdStart = 0, holdId = null, holdRAF = 0, hx = 0, hy = 0;

function holdTick(now) {
  const p = Math.min(1, (now - holdStart) / HOLD_MS);
  el("ring").style.setProperty("--p", p.toFixed(3));
  if (p >= 1) { endHold(); openSheet(); return; }
  holdRAF = requestAnimationFrame(holdTick);
}

function endHold() {
  cancelAnimationFrame(holdRAF);
  holdId = null;
  el("ring").classList.remove("on");
  el("ring").style.setProperty("--p", 0);
}

el("hold").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  el("hold").setPointerCapture(e.pointerId);
  holdId = e.pointerId;
  hx = e.clientX; hy = e.clientY;
  holdStart = performance.now();
  el("ring").classList.add("on");
  holdRAF = requestAnimationFrame(holdTick);
});

el("hold").addEventListener("pointermove", (e) => {
  // Sliding off cancels: this has to be a deliberate, steady hold.
  if (holdId === e.pointerId && Math.hypot(e.clientX - hx, e.clientY - hy) > 28) {
    endHold();
  }
});

for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
  el("hold").addEventListener(ev, (e) => {
    if (holdId === e.pointerId) endHold();
  });
}

// ------------------------------------------------------------- the switcher

let sheetTimer = 0;

function openSheet() {
  paintMute();
  el("sheet").classList.add("open");
  clearTimeout(sheetTimer);
  // Closes itself, so an opened sheet left alone returns to the game.
  sheetTimer = setTimeout(closeSheet, 10000);
}

function closeSheet() {
  clearTimeout(sheetTimer);
  el("sheet").classList.remove("open");
}

function paintDiag() {
  const i = Sound.info();
  el("diag").textContent =
    `audio ${i.state} · clock ${i.clock}s · played ${i.played} · dropped ${i.dropped}\n` +
    `rebuilds ${i.rebuilds} · media ${i.media}`;
}

function paintMute() {
  paintDiag();
  const st = Sound.state();
  el("mute").textContent =
    Sound.isMuted()      ? "Sound off" :
    st === "running"     ? "Sound on"  :
                           "Sound on (tap to start)";
}
el("mute").addEventListener("click", () => { Sound.unlock(); Sound.toggle(); paintMute(); });
paintMute();

// Somewhere to start over. The truck game deliberately keeps everything he
// does, so without this a world he is unhappy with is a world he is stuck in.
el("test").addEventListener("click", () => {
  const played = Sound.test();
  el("test").textContent =
    !played                ? "Blocked \u2014 tap again" :
    Sound.isMuted()        ? "Muted \u2014 turn sound on" :
                             "Heard nothing? Check the silent switch";
  setTimeout(() => { el("test").textContent = "Test sound"; paintMute(); }, 3500);
});

el("fresh").addEventListener("click", () => {
  if (wasm) wasm.restart();
  closeSheet();
});

el("close").addEventListener("click", closeSheet);
el("sheet").addEventListener("click", (e) => {
  if (e.target === el("sheet")) closeSheet();
});

if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
  el("full").hidden = false;
  el("full").addEventListener("click", () => {
    const d = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      Promise.resolve(
        (d.requestFullscreen || d.webkitRequestFullscreen).call(d, { navigationUI: "hide" })
      ).then(() => {
        // Both orientations work; landscape simply suits a side-on driving
        // game better, so ask for it and ignore a refusal.
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {});
        }
      }).catch(() => {});
    }
  });
}

// ---------------------------------------------------------------------- input

function turn(dir) { if (wasm) wasm.turn(dir); }
function again()   { if (wasm) wasm.restart(); }

addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeSheet(); return; }
  if (e.key in DIRS) {
    e.preventDefault();
    turn(DIRS[e.key]);
  } else if (e.key === " " || e.key === "Enter") {
    if (wasm && wasm.status() === 2) { e.preventDefault(); again(); }
  } else if (e.key === "Tab") {
    e.preventDefault();
    openSheet();               // keyboard escape hatch for desktop
  }
});

// pointerdown, not click: a toddler's finger lands and leaves elsewhere
el("turn").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  Sound.unlock();
  if (!wasm) return;
  wasm.flip();
  const b = el("turn");
  b.classList.toggle("spun");
});

el("again").addEventListener("click", again);

for (const b of document.querySelectorAll(".pad button")) {
  // pointerdown, not click: a toddler lifts a finger somewhere else entirely.
  b.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    turn(Number(b.dataset.dir));
  });
}

// Client coordinates into framebuffer space. The canvas fills the viewport at
// a matching aspect, so this is a straight scale.
function fbPoint(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * fw / r.width,
          (e.clientY - r.top)  * fh / r.height];
}

// Exactly one finger drives the game. A small hand plants a palm, a thumb and
// two more fingers on the glass at once; without this, every extra contact
// started a fresh grab and the first finger's rock was left stuck mid-air.
let sx = 0, sy = 0, activePointer = null;

canvas.addEventListener("pointerdown", (e) => {
  if (!wasm || activePointer !== null) return;   // a second finger is ignored
  e.preventDefault();
  Sound.unlock();
  canvas.setPointerCapture(e.pointerId);
  activePointer = e.pointerId;
  sx = e.clientX; sy = e.clientY;
  wasm.pointer(...fbPoint(e), DOWN);
});

canvas.addEventListener("pointermove", (e) => {
  if (!wasm || e.pointerId !== activePointer) return;
  e.preventDefault();
  wasm.pointer(...fbPoint(e), MOVE);
});

function endPointer(e) {
  if (!wasm || e.pointerId !== activePointer) return;
  activePointer = null;
  wasm.pointer(...fbPoint(e), UP);

  // Swipe-to-turn, for the games that steer.
  const g = GAMES[wasm.current()] || GAMES[0];
  if (!g.keys) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.hypot(dx, dy) < 24) {
    if (wasm.status() === 2) again();
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : 3);
  else turn(dy > 0 ? 2 : 0);
}

canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("lostpointercapture", (e) => {
  if (e.pointerId === activePointer) activePointer = null;
});
// Last resort: if the active pointer ends anywhere at all, let go of it. A
// stuck id would ignore every future touch — no input and no sound, with no
// way back short of a reload.
for (const ev of ["pointerup", "pointercancel"]) {
  window.addEventListener(ev, (e) => {
    if (e.pointerId === activePointer) activePointer = null;
  });
}

boot().catch((err) => {
  el("hint").hidden = false;
  el("hint").textContent = "Module failed to load — serve this folder over HTTP.";
  console.error(err);
});
</script>
</body>
</html>
